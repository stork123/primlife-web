<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Primordial Life</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; width: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 8px; left: 10px; color: #0f0; z-index: 5; font: 12px "Courier New", monospace; text-shadow: 0 0 4px #0f0; background: rgba(0,0,0,0.55); padding: 6px 10px; border: 1px solid #030; pointer-events: none; white-space: pre-wrap; max-width: 90vw; }
  #inspector { position: fixed; top: 8px; right: 10px; color: #6ff; z-index: 5; font: 12px "Courier New", monospace; background: rgba(0,0,0,0.7); padding: 6px 10px; border: 1px solid #033; white-space: pre; display: none; }
  #controls { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 6px; pointer-events: auto; user-select: none; }
  #controls button { background: #111; color: #cfc; border: 1px solid #0f0; font: 12px "Courier New", monospace; padding: 6px 8px; cursor: pointer; touch-action: manipulation; }
  #controls button:active { background: #030; color: #000; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud"></div>
<div id="inspector"></div>
<div id="controls">
  <button id="btn-pause">⏸</button>
  <button id="btn-restart">⟲</button>
  <button id="btn-sound">🔊</button>
  <button id="btn-guide">📖</button>
</div>
<script src="render.bundle.js"></script>
</body>
</html>
